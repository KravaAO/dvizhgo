<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DvizhGO — живі квізи для груп</title>
    <meta name="description" content="Створіть кімнату, підготуйте квіз і проведіть живу активність для своєї групи.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/page-transitions.js') }}"></script>
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</head>
<body class="dv-menu">
{% if error %}<span data-toast-message="{{ error }}" data-toast-type="error"></span>{% endif %}
<div class="dv-page">
    <header class="dv-header"><a class="dv-logo" href="{{ url_for('index') }}" aria-label="DvizhGO — головна"><img class="dv-brand-image" src="{{ url_for('static', filename='images/gologo.png') }}" alt="DvizhGO"></a><nav><a href="{{ url_for('index') }}" aria-current="page">Головна</a><a href="{{ url_for('how_it_works') }}">Як це працює</a></nav><div class="dv-live">● LIVE</div></header>
    <main class="dv-main">
        <section class="dv-visual" aria-label="DvizhGO"><div class="dv-logo-transition"><img src="{{ url_for('static', filename='images/gologo.png') }}" alt="DvizhGO"></div></section>
        <section class="dv-actions">
            <button type="button" id="openJoin" class="dv-action">
                <div class="dv-micro">01 / participant</div><h1>Увійти<br>в кімнату</h1>
                <p>Введіть код кімнати та своє ім’я.</p>
                <span class="dv-action-arrow">→</span>
            </button>
            <button type="button" id="openCreate" class="dv-action dv-create">
                <div class="dv-micro">02 / room host</div><h1>Створити<br>кімнату</h1>
                <p>Назва згенерується автоматично.</p><span class="dv-action-arrow">→</span>
            </button>
        </section>
    </main>
    <footer class="dv-footer">DvizhGO · live rooms <a href="{{ url_for('how_it_works') }}">Гайд для room host →</a></footer>
</div>
<aside id="accessPanel" class="dv-access-panel" aria-hidden="true">
    <div class="dv-panel-top"><span id="panelKicker" class="dv-micro">PARTICIPANT ACCESS</span><button id="closeAccess" class="dv-icon" type="button">×</button></div>
    <div id="joinPanel" class="dv-panel-body"><h2>Увійти<br>в кімнату</h2><form action="{{ url_for('join_room') }}" method="post"><label>Код кімнати<input name="code" maxlength="6" placeholder="K7M4Q2" required></label><label>Ваше ім’я<input name="name" maxlength="80" placeholder="Оля Коваль" required></label><button class="dv-panel-primary" type="submit">Увійти →</button></form></div>
    <div id="createPanel" class="dv-panel-body hidden"><h2>Нова<br>кімната</h2><p>Назва згенерується автоматично. Після створення ви потрапите в лобі.</p><form action="{{ url_for('create_new_room') }}" method="post"><button class="dv-panel-primary" type="submit">Створити кімнату →</button></form></div>
</aside>
<script>
document.querySelectorAll('.dv-action').forEach(action => {
    action.addEventListener('pointerdown', () => action.classList.add('is-pressed'));
    action.addEventListener('pointerup', () => action.classList.remove('is-pressed'));
    action.addEventListener('pointerleave', () => action.classList.remove('is-pressed'));
});
const panel=document.getElementById('accessPanel'), join=document.getElementById('joinPanel'), create=document.getElementById('createPanel');
function openPanel(kind, focusTarget){ panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); join.classList.toggle('hidden',kind!=='join'); create.classList.toggle('hidden',kind!=='create'); document.getElementById('panelKicker').textContent=kind==='join'?'PARTICIPANT ACCESS':'ROOM HOST'; setTimeout(()=> (focusTarget || panel.querySelector('input,button:not(#closeAccess)'))?.focus(),180); }
document.getElementById('openJoin').onclick=()=>openPanel('join'); document.getElementById('openCreate').onclick=()=>openPanel('create'); document.getElementById('closeAccess').onclick=()=>{panel.classList.remove('open');panel.setAttribute('aria-hidden','true')};
const inviteCode = new URLSearchParams(window.location.search).get('code')?.trim();
if(inviteCode){ const nameInput=join.querySelector('input[name="name"]'); join.querySelector('input[name="code"]').value=inviteCode.toUpperCase(); openPanel('join',nameInput); }
const logoAnimations = [
    "{{ url_for('static', filename='animations/dvizhgo-logo-transition.html') }}",
    "{{ url_for('static', filename='animations/dvizhgo-flat-to-3d.html') }}"
];
const logoMark = document.querySelector('.dv-logo-transition');
const animation = document.createElement('iframe');
animation.src = logoAnimations[Math.floor(Math.random() * logoAnimations.length)];
animation.title = 'DvizhGO logo animation';
animation.setAttribute('sandbox', 'allow-scripts');
animation.setAttribute('aria-hidden', 'true');
animation.tabIndex = -1;
logoMark.replaceChildren(animation);
</script>
</body>
</html>
