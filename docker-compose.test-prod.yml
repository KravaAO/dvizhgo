# Test-production override. Use only with docker-compose.yml and .env.production.
# Nginx reaches `web` over msschool_default; no Quiz service port is exposed on the host.
services:
  web:
    ports: !reset []
    environment:
      APP_ENV: production
    networks:
      default: {}
      shared_nginx:
        aliases:
          - quiz-platform-web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    ports: !reset []

  redis:
    ports: !reset []

networks:
  shared_nginx:
    name: msschool_default
    external: true
