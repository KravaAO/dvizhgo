# Add this server pair to Documents/knowstack/nginx/nginx.conf after issuing
# a certificate for quiz-test.tutordesk.site. It matches the KommoAI proxy
# pattern and uses Docker DNS, so Quiz has no host-facing application port.
server {
    listen 80;
    server_name quiz-test.tutordesk.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name quiz-test.tutordesk.site;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $quiz_upstream quiz-platform-web:5000;

    ssl_certificate /etc/letsencrypt/live/quiz-test.tutordesk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz-test.tutordesk.site/privkey.pem;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://$quiz_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Required by Flask-SocketIO for WebSocket transport.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
