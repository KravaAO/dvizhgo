# Add these server blocks to Documents/knowstack/nginx/nginx.conf.
# The TLS certificate must already exist at the paths below. DvizhGO has no
# host-facing port: KnowStack Nginx reaches it over msschool_default.
server {
    listen 80;
    server_name dvizhgo.knowstack.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dvizhgo.knowstack.space;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $dvizhgo_upstream dvizhgo-web:5000;

    ssl_certificate /etc/letsencrypt/live/dvizhgo.knowstack.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dvizhgo.knowstack.space/privkey.pem;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://$dvizhgo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Flask-SocketIO real-time rooms and the seekable MP4 both need these.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
