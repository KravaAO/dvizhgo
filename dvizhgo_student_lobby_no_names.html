<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DvizhGo — Student Lobby</title>
<style>
:root{
  --paper:#eee7d9;
  --ink:#171714;
  --signal:#ff5a36;
  --petrol:#164d4b;
  --chalk:#f8f3e9;
  --faded:#746e63;
  --mustard:#e7c94f;
  --dust:#8fb6a8;
  --rose:#cf6b74;
  --blue:#7c9fb8;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
body{overflow:hidden}
button{font:inherit}

.page{
  height:100vh;
  display:grid;
  grid-template-rows:76px 1fr 88px;
  background:
    linear-gradient(rgba(23,23,20,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(23,23,20,.03) 1px,transparent 1px),
    var(--paper);
  background-size:32px 32px;
}

/* header */
.header{
  border-bottom:2px solid var(--ink);
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  padding:0 18px;
  gap:18px;
}
.logo{
  display:flex;
  align-items:center;
  font-weight:1000;
  font-size:24px;
  letter-spacing:-.075em;
}
.logo-go{
  margin-left:2px;
  padding:6px 8px 7px;
  background:var(--ink);
  color:var(--paper);
  transform:rotate(-2deg);
  box-shadow:4px 4px 0 var(--signal);
}
.room-mini{
  justify-self:center;
  font:900 10px/1 "Courier New",monospace;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--faded);
}
.room-mini strong{
  color:var(--ink);
  margin-left:6px;
  letter-spacing:.16em;
}
.online{
  display:flex;
  align-items:center;
  gap:7px;
  font:900 10px/1 "Courier New",monospace;
  text-transform:uppercase;
}
.dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--petrol);
  box-shadow:0 0 0 3px rgba(22,77,75,.12);
}

/* stage */
.stage{
  position:relative;
  min-height:0;
  overflow:hidden;
}
.arena{
  position:absolute;
  inset:16px;
  border:2px solid var(--ink);
  background:
    linear-gradient(rgba(23,23,20,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(23,23,20,.035) 1px,transparent 1px),
    rgba(248,243,233,.34);
  background-size:24px 24px;
  overflow:hidden;
}
.arena-label{
  position:absolute;
  z-index:3;
  left:12px;
  top:12px;
  border:2px solid var(--ink);
  background:var(--paper);
  padding:6px 8px;
  font:900 9px/1 "Courier New",monospace;
  text-transform:uppercase;
  letter-spacing:.12em;
}

.dvd{
  position:absolute;
  width:72px;
  height:72px;
  border:2px solid var(--ink);
  background:var(--signal);
  box-shadow:4px 4px 0 var(--ink);
  display:grid;
  place-items:center;
  padding:5px;
  user-select:none;
  will-change:transform;
}
.dvd[data-color="petrol"]{background:var(--petrol);color:var(--chalk)}
.dvd[data-color="mustard"]{background:var(--mustard)}
.dvd[data-color="dust"]{background:var(--dust)}
.dvd[data-color="rose"]{background:var(--rose)}
.dvd[data-color="blue"]{background:var(--blue)}
.dvd[data-color="chalk"]{background:var(--chalk)}

.dvd-inner{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
}
.avatar{
  width:46px;
  height:46px;
  border:2px solid var(--ink);
  background:rgba(248,243,233,.55);
  display:grid;
  place-items:center;
  font-size:16px;
  font-weight:1000;
}
.dvd[data-color="petrol"] .avatar{
  border-color:var(--chalk);
  background:rgba(248,243,233,.12);
}

/* MY TILE */
.dvd.me{
  outline:5px solid var(--signal);
  outline-offset:4px;
  z-index:5;
}
.dvd.me:before{
  content:"YOU";
  position:absolute;
  top:-19px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--paper);
  padding:4px 6px;
  font:900 8px/1 "Courier New",monospace;
  letter-spacing:.12em;
}
.dvd.boosted{
  animation:boostPulse .18s steps(2,end) infinite;
}
.dvd.boosted:after{
  content:"⚡";
  position:absolute;
  right:-14px;
  top:-18px;
  font-size:22px;
}
@keyframes boostPulse{
  50%{box-shadow:8px 8px 0 var(--ink)}
}
.dvd.hit{animation:squash .15s ease-out}
@keyframes squash{50%{scale:1.08 .88}}
.dvd.spawn{animation:spawn .45s cubic-bezier(.2,.9,.2,1)}
@keyframes spawn{
  0%{opacity:0;scale:.45;rotate:-8deg}
  70%{opacity:1;scale:1.1;rotate:2deg}
  100%{scale:1;rotate:0}
}

/* small identity panel */
.identity{
  position:absolute;
  right:28px;
  top:28px;
  z-index:6;
  border:2px solid var(--ink);
  background:var(--chalk);
  padding:10px 12px;
  min-width:150px;
  box-shadow:4px 4px 0 var(--ink);
}
.identity .micro{
  font:900 8px/1 "Courier New",monospace;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--faded);
}
.identity strong{
  display:block;
  font-size:14px;
  margin-top:4px;
}
.identity span{
  display:block;
  margin-top:4px;
  font:800 9px/1.3 "Courier New",monospace;
  color:var(--faded);
}

/* waiting emoji */
.peek{
  position:absolute;
  right:-24px;
  bottom:110px;
  z-index:8;
  font-size:82px;
  transform:translateX(100%) rotate(10deg);
  animation:peek 9s cubic-bezier(.2,.8,.2,1) infinite;
  pointer-events:none;
}
@keyframes peek{
  0%,58%{transform:translateX(100%) rotate(10deg)}
  64%{transform:translateX(0) rotate(-4deg)}
  74%,82%{transform:translateX(6px) rotate(0)}
  90%,100%{transform:translateX(100%) rotate(10deg)}
}

/* footer */
.footer{
  border-top:2px solid var(--ink);
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:16px;
  padding:0 18px;
  background:var(--paper);
}
.wait{
  min-width:0;
}
.wait-title{
  font-size:16px;
  font-weight:1000;
  letter-spacing:-.02em;
}
.wait-sub{
  margin-top:3px;
  font:800 9px/1 "Courier New",monospace;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--faded);
}
.boost-block{
  display:flex;
  align-items:center;
  gap:12px;
}
.boost{
  width:150px;
  height:52px;
  border:2px solid var(--ink);
  background:var(--petrol);
  color:var(--chalk);
  font-weight:1000;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:5px 5px 0 var(--ink);
  transition:.15s;
}
.boost:not(:disabled):hover{
  transform:translate(-2px,-2px);
  box-shadow:8px 8px 0 var(--ink);
}
.boost:disabled{
  opacity:.42;
  cursor:not-allowed;
}
.timer{
  width:72px;
  font:900 11px/1 "Courier New",monospace;
  text-transform:uppercase;
  color:var(--faded);
}

.toast{
  position:fixed;
  z-index:30;
  top:90px;
  left:50%;
  transform:translate(-50%,-15px);
  background:var(--ink);
  color:var(--chalk);
  border:2px solid var(--chalk);
  padding:10px 13px;
  font:900 10px/1 "Courier New",monospace;
  text-transform:uppercase;
  opacity:0;
  transition:.18s;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:700px){
  .page{grid-template-rows:68px 1fr 116px}
  .header{grid-template-columns:1fr auto;padding:0 12px}
  .room-mini{display:none}
  .arena{inset:10px}
  .dvd{width:62px;height:62px}
  .avatar{width:40px;height:40px;font-size:14px}
  .identity{right:20px;top:20px;min-width:128px;padding:8px 10px}
  .footer{
    grid-template-columns:1fr;
    align-content:center;
    gap:10px;
    padding:10px 12px;
  }
  .boost-block{justify-content:space-between}
  .boost{width:calc(100% - 84px)}
}
</style>
</head>
<body>
<div class="toast" id="toast">BOOST!</div>

<div class="page">
  <header class="header">
    <div class="logo">Dvizh<span class="logo-go">GO</span></div>

    <div class="room-mini">
      room <strong>K7M4Q2</strong>
    </div>

    <div class="online">
      <span class="dot"></span>
      <span id="onlineCount">12 online</span>
    </div>
  </header>

  <main class="stage">
    <div class="arena" id="arena">
      <div class="arena-label">Lobby / waiting room</div>
    </div>

    <div class="identity">
      <div class="micro">your tile</div>
      <strong>YOU</strong>
      <span>orange / avatar slot</span>
    </div>

    <div class="peek" aria-hidden="true">👀</div>
  </main>

  <footer class="footer">
    <div class="wait">
      <div class="wait-title">Чекаємо викладача</div>
      <div class="wait-sub" id="statusText">можеш трохи подвіжувати квадратиком</div>
    </div>

    <div class="boost-block">
      <button class="boost" id="boostBtn">⚡ BOOST</button>
      <div class="timer" id="timer">READY</div>
    </div>
  </footer>
</div>

<script>
const arena=document.getElementById("arena");
const onlineCount=document.getElementById("onlineCount");
const boostBtn=document.getElementById("boostBtn");
const timer=document.getElementById("timer");
const statusText=document.getElementById("statusText");

const palette=["signal","petrol","mustard","dust","rose","blue","chalk"];
const baseSpeed=66;
const boostFactor=2.25;
const boostDuration=2500;
const cooldownDuration=8500;

const students=[
  "Артем",
  "Оля",
  "Максим",
  "Іра",
  "Данило",
  "Софія",
  "Влад",
  "Марія",
  "Андрій",
  "Катя",
  "Назар",
  "Богдан"
];

const bodies=[];
let myBody=null;
let boostUntil=0;
let cooldownUntil=0;
let last=performance.now();

function rand(min,max){return min+Math.random()*(max-min)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function initials(name){return name.slice(0,2).toUpperCase()}

function createBody(name,index,isMe=false){
  const el=document.createElement("div");
  el.className="dvd spawn"+(isMe?" me":"");
  el.dataset.color=isMe?"signal":palette[index%palette.length];

  el.innerHTML=`
    <div class="dvd-inner">
      <div class="avatar">${initials(name)}</div>
    </div>
  `;
  arena.appendChild(el);

  const angle=rand(0,Math.PI*2);
  const speed=baseSpeed*rand(.86,1.16);

  const body={
    name,el,
    x:0,y:0,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    w:el.offsetWidth,
    h:el.offsetHeight,
    boosted:false
  };

  const maxX=Math.max(0,arena.clientWidth-body.w);
  const maxY=Math.max(0,arena.clientHeight-body.h);

  body.x=rand(8,Math.max(9,maxX-8));
  body.y=rand(42,Math.max(43,maxY-8));

  for(let t=0;t<40;t++){
    let overlap=false;
    for(const other of bodies){
      if(
        body.x < other.x+other.w+8 &&
        body.x+body.w+8 > other.x &&
        body.y < other.y+other.h+8 &&
        body.y+body.h+8 > other.y
      ){
        overlap=true;
        body.x=rand(8,Math.max(9,maxX-8));
        body.y=rand(42,Math.max(43,maxY-8));
        break;
      }
    }
    if(!overlap)break;
  }

  bodies.push(body);
  if(isMe)myBody=body;
}

function impact(b){
  b.el.classList.remove("hit");
  void b.el.offsetWidth;
  b.el.classList.add("hit");
  setTimeout(()=>b.el.classList.remove("hit"),160);
}

function wallBounce(b){
  const maxX=Math.max(0,arena.clientWidth-b.w);
  const maxY=Math.max(0,arena.clientHeight-b.h);
  let hit=false;

  if(b.x<=0){b.x=0;b.vx=Math.abs(b.vx);hit=true}
  else if(b.x>=maxX){b.x=maxX;b.vx=-Math.abs(b.vx);hit=true}

  if(b.y<=0){b.y=0;b.vy=Math.abs(b.vy);hit=true}
  else if(b.y>=maxY){b.y=maxY;b.vy=-Math.abs(b.vy);hit=true}

  if(hit)impact(b);
}

function collide(a,b){
  const dx=(b.x+b.w/2)-(a.x+a.w/2);
  const dy=(b.y+b.h/2)-(a.y+a.h/2);
  const ox=(a.w+b.w)/2-Math.abs(dx);
  const oy=(a.h+b.h)/2-Math.abs(dy);

  if(ox<=0||oy<=0)return;

  if(ox<oy){
    const s=dx>=0?1:-1;
    a.x-=s*ox/2;b.x+=s*ox/2;
    [a.vx,b.vx]=[b.vx,a.vx];
  }else{
    const s=dy>=0?1:-1;
    a.y-=s*oy/2;b.y+=s*oy/2;
    [a.vy,b.vy]=[b.vy,a.vy];
  }

  impact(a);impact(b);
}

function setSpeed(b,target){
  const len=Math.hypot(b.vx,b.vy)||1;
  b.vx=b.vx/len*target;
  b.vy=b.vy/len*target;
}

function updateBoost(now){
  const active=now<boostUntil;

  if(myBody){
    if(active&&!myBody.boosted){
      setSpeed(myBody,baseSpeed*boostFactor);
      myBody.boosted=true;
      myBody.el.classList.add("boosted");
    }else if(!active&&myBody.boosted){
      setSpeed(myBody,baseSpeed);
      myBody.boosted=false;
      myBody.el.classList.remove("boosted");
    }
  }

  if(now<boostUntil){
    timer.textContent=`BOOST ${(boostUntil-now)/1000|0}.${Math.floor(((boostUntil-now)%1000)/100)}`;
    boostBtn.disabled=true;
  }else if(now<cooldownUntil){
    timer.textContent=`${((cooldownUntil-now)/1000).toFixed(1)}s`;
    boostBtn.disabled=true;
  }else{
    timer.textContent="READY";
    boostBtn.disabled=false;
  }
}

function tick(now){
  const dt=Math.min(.032,(now-last)/1000);
  last=now;

  updateBoost(now);

  for(const b of bodies){
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    wallBounce(b);
  }

  for(let i=0;i<bodies.length;i++){
    for(let j=i+1;j<bodies.length;j++)collide(bodies[i],bodies[j]);
  }

  for(const b of bodies){
    b.el.style.transform=`translate3d(${b.x}px,${b.y}px,0)`;
  }

  requestAnimationFrame(tick);
}

students.forEach((name,i)=>createBody(name,i,i===0));
onlineCount.textContent=`${students.length} online`;

boostBtn.onclick=()=>{
  const now=performance.now();
  if(now<cooldownUntil)return;
  boostUntil=now+boostDuration;
  cooldownUntil=now+cooldownDuration;
  statusText.textContent="твій квадрат пішов у відрив ⚡";
  setTimeout(()=>statusText.textContent="можеш трохи подвіжувати квадратиком",1500);
};

function resizeBodies(){
  for(const b of bodies){
    b.w=b.el.offsetWidth;
    b.h=b.el.offsetHeight;
    b.x=clamp(b.x,0,Math.max(0,arena.clientWidth-b.w));
    b.y=clamp(b.y,0,Math.max(0,arena.clientHeight-b.h));
  }
}
window.addEventListener("resize",resizeBodies);

requestAnimationFrame(tick);
</script>
</body>
</html>
