# Production override. Run with `docker compose -p dvizhgo` and .env.production.
# All application ports stay private; KnowStack Nginx reaches the web service
# through the shared external Docker network.
services:
  web:
    ports: !reset []
    environment:
      APP_ENV: production
    networks:
      default: {}
      shared_nginx:
        aliases:
          - dvizhgo-web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    ports: !reset []

  redis:
    ports: !reset []

networks:
  shared_nginx:
    name: msschool_default
    external: true
